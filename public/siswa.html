<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/siswa.css" />
  </head>
  <body>
    <div id="toastContainer" class="toast-container"></div>

    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p>Memuat data...</p>
    </div>

    <header class="app-header">
      <div class="header-inner">
        <h1>Student Management System</h1>
        <button id="darkModeToggle" class="btn btn-icon" title="Ganti tema">🌙</button>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <div class="toolbar-left">
          <input type="text" id="searchInput" placeholder="Cari nama atau NIS..." />
          <select id="filterKelas">
            <option value="">Semua Kelas</option>
          </select>
        </div>
        <button id="btnTambah" class="btn btn-primary">+ Tambah Siswa</button>
      </section>

      <section class="table-wrapper">
        <table id="siswaTable">
          <thead>
            <tr>
              <th>ID</th><th>Foto</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Jurusan</th><th>Alamat</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="siswaTableBody"></tbody>
        </table>
        <p id="emptyState" class="empty-state hidden">Belum ada data siswa.</p>
      </section>

      <section class="pagination" id="paginationContainer"></section>
    </main>

    <div id="formModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="formModalTitle">Tambah Siswa</h2>
          <button class="btn-close" id="closeFormModal">&times;</button>
        </div>
        <form id="siswaForm">
          <input type="hidden" id="siswaId" />
          <div class="form-group">
            <label for="nis">NIS <span class="required">*</span></label>
            <input type="text" id="nis" name="nis" required placeholder="Contoh: 2026001" />
            <small class="field-error" id="error-nis"></small>
          </div>
          <div class="form-group">
            <label for="nama">Nama Lengkap <span class="required">*</span></label>
            <input type="text" id="nama" name="nama" required placeholder="Contoh: Budi Santoso" />
            <small class="field-error" id="error-nama"></small>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="kelas">Kelas <span class="required">*</span></label>
              <input type="text" id="kelas" name="kelas" required placeholder="Contoh: XI RPL 1" />
              <small class="field-error" id="error-kelas"></small>
            </div>
            <div class="form-group">
              <label for="jurusan">Jurusan <span class="required">*</span></label>
              <input type="text" id="jurusan" name="jurusan" required placeholder="Contoh: Rekayasa Perangkat Lunak" />
              <small class="field-error" id="error-jurusan"></small>
            </div>
          </div>
          <div class="form-group">
            <label for="alamat">Alamat <span class="required">*</span></label>
            <textarea id="alamat" name="alamat" required placeholder="Contoh: Jakarta"></textarea>
            <small class="field-error" id="error-alamat"></small>
          </div>
          <div class="form-group">
            <label for="foto">Foto Siswa (opsional)</label>
            <input type="file" id="foto" name="foto" accept="image/png, image/jpeg, image/webp" />
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="cancelFormBtn">Batal</button>
            <button type="submit" class="btn btn-primary" id="submitFormBtn">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <div id="deleteModal" class="modal hidden">
      <div class="modal-content modal-small">
        <div class="modal-header">
          <h2>Konfirmasi Hapus</h2>
          <button class="btn-close" id="closeDeleteModal">&times;</button>
        </div>
        <p>Apakah Anda yakin ingin menghapus data siswa <strong id="deleteSiswaName"></strong>? Tindakan ini tidak dapat dibatalkan.</p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelDeleteBtn">Batal</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Hapus</button>
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <p>Student Management System &copy; 2026 — Praktik Pemrograman Web</p>
    </footer>

    <script src="js/siswaApi.js"></script>
    <script src="js/siswaApp.js"></script>
  </body>
</html>
