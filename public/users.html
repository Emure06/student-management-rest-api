<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar User — Login</title>
    <style>
      :root {
        --ink: #1c2b24;
        --paper: #f6f5f0;
        --line: #d8d5c8;
        --accent: #3d6b52;
        --muted: #6b6f66;
        --error: #a33d3d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: "Georgia", "Times New Roman", serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 24px;
      }

      .wrap {
        width: 100%;
        max-width: 820px;
      }

      /* ---------- LOGIN CARD ---------- */
      .login-card {
        max-width: 360px;
        margin: 60px auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 32px;
      }

      .login-card h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 400;
      }

      .login-card p.sub {
        margin: 0 0 24px;
        font-size: 13px;
        color: var(--muted);
        font-family: "Courier New", monospace;
      }

      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 16px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-family: inherit;
        font-size: 15px;
        background: var(--paper);
        color: var(--ink);
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
      }

      button {
        font-family: inherit;
        font-size: 14px;
        padding: 10px 18px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
        border-radius: 4px;
        width: 100%;
        transition: opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.85;
      }

      button.ghost {
        background: transparent;
        color: var(--ink);
        width: auto;
        padding: 8px 16px;
      }

      button.small {
        width: auto;
        padding: 5px 10px;
        font-size: 12px;
      }

      button.danger {
        background: var(--error);
        border-color: var(--error);
      }

      .msg {
        font-size: 13px;
        margin-top: 12px;
        min-height: 16px;
      }

      .msg.error {
        color: var(--error);
      }
      .msg.ok {
        color: var(--accent);
      }

      /* ---------- DATA PAGE ---------- */
      #dataPage {
        display: none;
      }

      header {
        margin-bottom: 24px;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
      }

      h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 400;
      }

      .who {
        font-family: "Courier New", monospace;
        font-size: 13px;
        color: var(--muted);
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      /* ---------- FORM TAMBAH / EDIT USER ---------- */
      .form-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 20px 24px;
        margin-bottom: 24px;
      }

      .form-card h3 {
        margin: 0 0 14px;
        font-size: 15px;
        font-weight: 400;
        color: var(--muted);
      }

      .form-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .form-row input {
        margin-bottom: 0;
        flex: 1;
        min-width: 140px;
      }

      .form-row button {
        width: auto;
        white-space: nowrap;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }

      thead th {
        text-align: left;
        font-weight: 400;
        font-size: 13px;
        color: var(--muted);
        padding: 10px 14px;
        border-bottom: 2px solid var(--ink);
      }

      tbody td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
      }

      tbody tr:hover {
        background: #f0efe8;
      }

      td.id {
        color: var(--muted);
        font-family: "Courier New", monospace;
        font-size: 13px;
        width: 48px;
      }

      td.actions {
        white-space: nowrap;
        width: 1%;
      }

      td.actions button {
        margin-right: 6px;
      }

      .state {
        padding: 40px 14px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }

      .state.error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- ============ HALAMAN LOGIN ============ -->
      <div class="login-card" id="loginPage">
        <h1>Masuk</h1>
        <p class="sub">login untuk mengelola data user</p>

        <form id="loginForm">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nama@mail.com" required />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          />

          <button type="submit">Login</button>
        </form>

        <div class="msg" id="loginMsg"></div>
      </div>

      <!-- ============ HALAMAN DATA (setelah login) ============ -->
      <div id="dataPage">
        <header>
          <h2>Kelola User</h2>
          <span class="who" id="whoAmI"></span>
        </header>

        <!-- FORM TAMBAH / EDIT -->
        <div class="form-card">
          <h3 id="formTitle">Tambah user baru</h3>
          <form id="userForm">
            <input type="hidden" id="editId" />
            <div class="form-row">
              <input type="text" id="fNama" placeholder="Nama" required />
              <input type="email" id="fEmail" placeholder="Email" required />
              <input
                type="password"
                id="fPassword"
                placeholder="Password"
                required
              />
              <button type="submit" id="submitBtn">Tambah</button>
              <button
                type="button"
                class="ghost"
                id="cancelEditBtn"
                style="display: none"
              >
                Batal
              </button>
            </div>
          </form>
          <div class="msg" id="formMsg"></div>
        </div>

        <div class="toolbar">
          <button class="ghost" onclick="loadUsers()">Muat ulang</button>
          <button class="ghost" onclick="logout()">Logout</button>
        </div>

        <table>
          <thead>
            <tr>
              <th style="width: 48px">No</th>
              <th>Nama</th>
              <th>Email</th>
              <th style="width: 1%">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="4" class="state">memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      const BASE_URL = "http://localhost:3000";

      let token = null;
      let editingId = null; // null = mode tambah, terisi = mode edit

      const loginPage = document.getElementById("loginPage");
      const dataPage = document.getElementById("dataPage");
      const loginForm = document.getElementById("loginForm");
      const loginMsg = document.getElementById("loginMsg");
      const whoAmI = document.getElementById("whoAmI");

      const userForm = document.getElementById("userForm");
      const formMsg = document.getElementById("formMsg");
      const formTitle = document.getElementById("formTitle");
      const submitBtn = document.getElementById("submitBtn");
      const cancelEditBtn = document.getElementById("cancelEditBtn");

      const fNama = document.getElementById("fNama");
      const fEmail = document.getElementById("fEmail");
      const fPassword = document.getElementById("fPassword");

      // ---------- LOGIN ----------
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        loginMsg.textContent = "memproses...";
        loginMsg.className = "msg";

        try {
          const res = await fetch(BASE_URL + "/user/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (!res.ok) {
            loginMsg.textContent = data.error || "Login gagal";
            loginMsg.className = "msg error";
            return;
          }

          token = data.token;
          loginMsg.textContent = "";
          whoAmI.textContent = email;

          loginPage.style.display = "none";
          dataPage.style.display = "block";

          loadUsers();
        } catch (err) {
          console.error(err);
          loginMsg.textContent = "Tidak bisa terhubung ke server";
          loginMsg.className = "msg error";
        }
      });

      // ---------- TAMBAH / UPDATE USER ----------
      userForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nama = fNama.value.trim();
        const email = fEmail.value.trim();
        const password = fPassword.value;

        formMsg.textContent = "menyimpan...";
        formMsg.className = "msg";

        try {
          let res;

          if (editingId) {
            // MODE EDIT -> PUT
            res = await fetch(BASE_URL + "/user/put/" + editingId, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify({ nama, email, password }),
            });
          } else {
            // MODE TAMBAH -> POST register
            res = await fetch(BASE_URL + "/user/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ nama, email, password }),
            });
          }

          const data = await res.json();

          if (!res.ok) {
            formMsg.textContent = data.error || "Gagal menyimpan data";
            formMsg.className = "msg error";
            return;
          }

          formMsg.textContent = editingId
            ? "User berhasil diupdate"
            : "User berhasil ditambahkan";
          formMsg.className = "msg ok";

          resetForm();
          loadUsers();
        } catch (err) {
          console.error(err);
          formMsg.textContent = "Tidak bisa terhubung ke server";
          formMsg.className = "msg error";
        }
      });

      // ---------- BATAL EDIT ----------
      cancelEditBtn.addEventListener("click", resetForm);

      function resetForm() {
        editingId = null;
        userForm.reset();
        formTitle.textContent = "Tambah user baru";
        submitBtn.textContent = "Tambah";
        cancelEditBtn.style.display = "none";
        formMsg.textContent = "";
      }

      // ---------- MASUK MODE EDIT ----------
      function startEdit(id, nama, email) {
        editingId = id;
        fNama.value = nama;
        fEmail.value = email;
        fPassword.value = "";
        fPassword.placeholder = "Password baru";
        formTitle.textContent = "Edit user #" + id;
        submitBtn.textContent = "Simpan";
        cancelEditBtn.style.display = "inline-block";
        formMsg.textContent = "";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // ---------- HAPUS USER ----------
      async function deleteUser(id) {
        if (!confirm("Yakin mau hapus user #" + id + "?")) return;

        try {
          const res = await fetch(BASE_URL + "/user/delete/" + id, {
            method: "DELETE",
            headers: { Authorization: "Bearer " + token },
          });

          const data = await res.json();

          if (!res.ok) {
            alert(data.error || "Gagal menghapus user");
            return;
          }

          loadUsers();
        } catch (err) {
          console.error(err);
          alert("Tidak bisa terhubung ke server");
        }
      }

      // ---------- AMBIL DATA ----------
      async function loadUsers() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML =
          '<tr><td colspan="4" class="state">memuat data...</td></tr>';

        try {
          const res = await fetch(BASE_URL + "/user/get", {
            headers: {
              Authorization: "Bearer " + token,
            },
          });

          if (res.status === 401 || res.status === 403) {
            logout();
            return;
          }

          const users = await res.json();

          if (!Array.isArray(users) || users.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="4" class="state">belum ada data user</td></tr>';
            return;
          }

          tbody.innerHTML = users
            .map((u, index) => {
              const nama = escapeHtml(u.nama ?? "-");
              const email = escapeHtml(u.email ?? "-");
              const nomorUrut = index + 1; // nomor tampilan, selalu urut 1,2,3,4...
              return `
                <tr>
                    <td class="id">${nomorUrut}</td>
                    <td>${nama}</td>
                    <td>${email}</td>
                    <td class="actions">
                        <button class="small ghost" onclick="startEdit(${u.id}, '${nama}', '${email}')">Edit</button>
                        <button class="small danger" onclick="deleteUser(${u.id})">Hapus</button>
                    </td>
                </tr>
              `;
            })
            .join("");
        } catch (err) {
          console.error(err);
          tbody.innerHTML = `<tr><td colspan="4" class="state error">
                gagal memuat data — pastikan server berjalan
            </td></tr>`;
        }
      }

      function logout() {
        token = null;
        dataPage.style.display = "none"
        loginPage.style.display = "block";
        loginForm.reset();
        loginMsg.textContent = "";
        resetForm();
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        return div.innerHTML;
      }
    </script>
  </body>
</html>
